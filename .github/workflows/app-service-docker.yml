name: App Service Docker

on:
  push:
    branches: [ "prod", "preview", "dev" ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  AZURE_WEBAPP_NAME: web-thebakerz
  # Using github.ref_name to simplify logic:
  TYPE: ${{ github.ref_name == 'prod' && 'prod' || github.ref_name == 'preview' && 'preview' || 'dev' }}

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f95db51fddba0c2d1ec667646a06c2ce06100226 # v3.0.0

      - name: Log in to GitHub container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase the repo name and username
        run: echo "REPO=${GITHUB_REPOSITORY,,}" >>${GITHUB_ENV}

      - name: Build and push container image to registry
        uses: docker/build-push-action@0565240e2d4ab88bba5387d719585280857ece09
        with:
          push: true
          tags: ${{ env.REGISTRY }}/${{env.TYPE}}-${{ env.REPO }}:${{ github.sha }}
          file: ./Dockerfile


  deploy:
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: ${{ github.ref_name == 'prod' && 'production' || github.ref_name == 'preview' && 'preview' || 'development' }}
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
      - name: Lowercase the repo name and username
        run: echo "REPO=${GITHUB_REPOSITORY,,}" >>${GITHUB_ENV}


      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.PUBLISH_PROFILE_DOCKER }}
          images: "${{ env.REGISTRY }}/${{env.TYPE}}-${{ env.REPO }}:${{ github.sha }}"

