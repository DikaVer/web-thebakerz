name: Build and Deploy to Azure App Service

on:
  push:
    branches:
      - prod
      - preview
      - dev
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  AZURE_WEBAPP_NAME: web-thebakerz
  # Determine the deployment type based on branch name
  TYPE: ${{ github.ref_name == 'prod' && 'prod' || github.ref_name == 'preview' && 'preview' || 'dev' }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          # Enable multiple builders for parallel processing
          driver-opts: |
            network=host
          buildkitd-flags: --debug

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase repository name
        run: echo "REPO=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.REPO }}:${{ github.sha }},${{ env.REGISTRY }}/${{ env.REPO }}:${{ env.TYPE }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.REPO }}:${{ env.TYPE }}-cache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.REPO }}:${{ env.TYPE }}-cache,mode=max
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=${{ vars.NEXT_PUBLIC_API_BASE_URL }}
            NEXT_PUBLIC_AZURE_MAPS_KEY=${{ vars.NEXT_PUBLIC_AZURE_MAPS_KEY }}
            NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${{ vars.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
            NEXT_PUBLIC_GOOGLE_MAPS_API_KEY=${{ vars.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.PUBLISH_PROFILE_DOCKER }}
          images: "${{ env.REGISTRY }}/${{ env.REPO }}:${{ github.sha }}"
