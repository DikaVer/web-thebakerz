name: Build and Deploy to Azure App Service

on:
  push:
    branches:
      - prod
      - preview
      - dev
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  AZURE_WEBAPP_NAME: web-thebakerz
  # Determine the deployment type based on branch name
  TYPE: ${{ github.ref_name == 'prod' && 'prod' || github.ref_name == 'preview' && 'preview' || 'dev' }}
  AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
  AZURE_COMMUNICATION_EMAIL_ENDPOINT: ${{ secrets.AZURE_COMMUNICATION_EMAIL_ENDPOINT }}
  AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
  CONTAINER_NAME_AVATARS: ${{ secrets.CONTAINER_NAME_AVATARS }}
  DATABASE_HOST: ${{ secrets.DATABASE_HOST }}
  DATABASE_NAME: ${{ secrets.DATABASE_NAME }}
  DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  DATABASE_USER: ${{ secrets.DATABASE_USER }}
  EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
  GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
  GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
  NEXT_PUBLIC_API_BASE_URL: ${{ secrets.NEXT_PUBLIC_API_BASE_URL }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase repository name
        run: echo "REPO=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Build Docker image
        uses: docker/build-push-action@v4
        with:
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.REPO }}:${{ github.sha }}
          build-args: |
            AUTH_SECRET=${{ env.AUTH_SECRET }}
            AZURE_COMMUNICATION_EMAIL_ENDPOINT=${{ env.AZURE_COMMUNICATION_EMAIL_ENDPOINT }}
            AZURE_STORAGE_CONNECTION_STRING=${{ env.AZURE_STORAGE_CONNECTION_STRING }}
            CONTAINER_NAME_AVATARS=${{ env.CONTAINER_NAME_AVATARS }}
            DATABASE_HOST=${{ env.DATABASE_HOST }}
            DATABASE_NAME=${{ env.DATABASE_NAME }}
            DATABASE_PASSWORD=${{ env.DATABASE_PASSWORD }}
            DATABASE_URL=${{ env.DATABASE_URL }}
            DATABASE_USER=${{ env.DATABASE_USER }}
            EMAIL_FROM=${{ env.EMAIL_FROM }}
            GOOGLE_CLIENT_ID=${{ env.GOOGLE_CLIENT_ID }}
            GOOGLE_CLIENT_SECRET=${{ env.GOOGLE_CLIENT_SECRET }}
            NEXT_PUBLIC_API_BASE_URL=${{ env.NEXT_PUBLIC_API_BASE_URL }}
  

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: ${{ github.ref_name == 'prod' && 'production' || github.ref_name == 'preview' && 'preview' || 'development' }}
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}
    steps:
      - name: Lowercase repository name
        run: echo "REPO=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.PUBLISH_PROFILE_DOCKER }}
          images: "${{ env.REGISTRY }}/${{ env.REPO }}:${{ github.sha }}"
